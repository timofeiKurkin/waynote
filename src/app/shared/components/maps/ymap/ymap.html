@if (mapProps() && featureProps()) {
<y-map [props]="mapProps()" class="block ymap" [style.max-width]="mapSize() + 'px'" [style.height]="mapSize() + 'px'">
  <y-map-default-scheme-layer />
  <y-map-default-features-layer />

  @if (featureProps()) {
  <y-map-feature [props]="featureProps()" />
  }
</y-map>
} @else {
<div [style.max-width]="mapSize() + 'px'" [style.height]="mapSize() + 'px'" class="no-map center">
  <h5 class="tui-text_h5">Вы еще не загрузили карту</h5>
</div>
}
