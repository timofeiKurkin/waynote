<li class="trail-card" tuiAppearance="floating">
  <div class="static-map-wrapper">
    <app-static-map [GPX]="trail().gpx" [mapSize]="400"></app-static-map>
  </div>

  <div class="trail-card__content">
    <div class="trail-description"><span>{{ trail().city }}</span> - <span>{{ trail().year }}</span></div>

    <h6 class="tui-text_h6 card-title">{{ trail().title }}</h6>

    <button [routerLink]="[trail().id]" appearance="primary" tuiButton type="button">Подробнее о маршруте</button>
  </div>
</li>
