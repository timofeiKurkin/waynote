<form
        (submit)="registration()"
        [formGroup]="registrationForm"
        [style.max-width.rem]="35"
        tuiForm="l"
>
    <header tuiHeader>
        <h3 tuiTitle>
            Создать новый аккаунт
            <span tuiSubtitle>Найди свой маршрут в WAYNOTE</span>
        </h3>
    </header>

    <tui-textfield>
        <label for="email" tuiLabel>Email</label>
        <input
                formControlName="email"
                id="email"
                placeholder="Email"
                tuiTextfield
        />
    </tui-textfield>

    <tui-error
            [error]="[] | tuiFieldError | async"
            formControlName="email"
    />


    <tui-textfield>
        <label for="password" tuiLabel>Пароль</label>
        <input
                formControlName="password"
                id="password"
                tuiTextfield
                type="password"
        />
        <!--        <tui-icon tuiPassword/>-->
    </tui-textfield>
    <tui-error
            [error]="[] | tuiFieldError | async"
            formControlName="password"
    />


    <label tuiLabel>
        <input
                formControlName="policy"
                tuiCheckbox
                type="checkbox"
        />
        Мы будем хранить ваш email
    </label>

    <tui-error
            [error]="[] | tuiFieldError | async"
            formControlName="policy"
    />

    <footer>
        <button
                tuiButton
                type="submit"
        >
            Войти
        </button>
    </footer>
</form>

<hr>

<button
        (click)="googleAuth()"
        appearance="primary"
        tuiButton
        type="button"
>
    Регистрация через Google
</button>
