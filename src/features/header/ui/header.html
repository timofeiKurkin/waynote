<div class="header-background">
    <div class="app-grid">
        <div class="header">
            <a class="header__logo" routerLink="/">
                <img
                        alt="waynote - logo"
                        height="40"
                        ngSrc="/bike.png"
                        priority
                        width="40"/>

                <h5 class="tui-text_h5 logo-title">Waynote</h5>
            </a>

            <nav>
                <ul class="header__nav">
                    <li>
                        <a class="nav-item" routerLink="/">Главная</a>
                    </li>
                    <li>
                        <a class="nav-item" routerLink="/my-routes">Мои маршруты</a>
                    </li>
                    <li>
                        <a class="nav-item" routerLink="/settings">Настройки</a>
                    </li>
                </ul>
            </nav>

            <div>
                @if (isAuth) {
                    {{ user.displayName }}

                    <button (click)="logout()">выйти</button>
                } @else {
                    <div class="header__auth">
                        <a tuiLink routerLink="/login"> Войти </a>
                        <span class="no-select">|</span>
                        <a tuiLink routerLink="/register"> Регистрация </a>
                    </div>
                }
            </div>
        </div>
    </div>
</div>
