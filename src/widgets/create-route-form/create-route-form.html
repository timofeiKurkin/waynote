<div class="app-grid">
    <div class="create-route">
        <ng-container>
            <ng-container>
                <tui-stepper [activeItemIndex]="formStepIndex()">
                    <button [disabled]="true"
                            tuiStep
                            type="button"
                    >
                        Загрузка маршрута
                    </button>
                    <button [disabled]="true"
                            tuiStep
                            type="button"
                    >
                        Описание маршрута
                    </button>
                </tui-stepper>
            </ng-container>
        </ng-container>

        <ng-container>
            @switch (formStepIndex()) {
                @case (0) {
                    <ng-container>
                        <form tuiCardLarge
                              tuiAppearance="floating">
                            <header tuiHeader>
                                <h2 tuiTitle>
                                    Загрузка файла GPX
                                    <span tuiSubtitle></span>
                                </h2>
                            </header>

                            <div class="load-map">
                                <app-drop-zone (loadGPX)="loadFile($event)"></app-drop-zone>

                                <app-ymap [GPX]="paredGPX()" [mapSize]="500"></app-ymap>
                            </div>
                        </form>

                        <footer>
                            <button appearance="secondary"
                                    size="l"
                                    tuiButton
                                    routerLink="/"
                                    type="button"
                            >
                                Отмена
                            </button>
                            <button (click)="next()"
                                    size="l"
                                    tuiButton
                                    type="submit"
                            >
                                Описать маршрут
                            </button>
                        </footer>
                    </ng-container>

                }
                @case (1) {
                    <ng-container>
                        <form [formGroup]="describeRouteForm"
                              tuiAppearance="floating"
                              tuiForm="l"
                              tuiCardLarge
                        >
                            <header tuiHeader>
                                <h2 tuiTitle>
                                    Описание маршрута
                                    <span class="header-subtitle" tuiSubtitle>Не стесняйтесь описать ваш маршрут, это поможет другим велосипедистам. Опишите сложные и опасные участки. </span>
                                </h2>
                            </header>


                            <tui-textfield>
                                <label for="route-title" tuiLabel>Название маршрута</label>
                                <input formControlName="title"
                                       id="route-title"
                                       placeholder="Название"
                                       tuiTextfield
                                />
                            </tui-textfield>
                            <tui-error [error]="[] | tuiFieldError | async"
                                       formControlName="title"
                            />

                            <tui-textfield>
                                <label for="route-title" tuiLabel>Город</label>
                                <input formControlName="city"
                                       id="route-title"
                                       placeholder="Город"
                                       tuiTextfield
                                />
                            </tui-textfield>
                            <tui-error [error]="[] | tuiFieldError | async"
                                       formControlName="city"
                            />

                            <tui-textfield>
                                <label for="route-year" tuiLabel>Укажите дату создания маршрута</label>
                                <input [max]="2025"
                                       [min]="2004"
                                       formControlName="year"
                                       id="route-year"
                                       tuiInputYear
                                />
                                <tui-calendar-year *tuiTextfieldDropdown/>
                            </tui-textfield>
                            <tui-error [error]="[] | tuiFieldError | async"
                                       formControlName="year"
                            />

                            <tui-textfield>
                                <label for="route-description" tuiLabel>Limit</label>
                                <textarea [limit]="300"
                                          [max]="6"
                                          [min]="3"
                                          formControlName="description"
                                          id="route-description"
                                          placeholder="Placeholder"
                                          tuiTextarea
                                ></textarea>
                            </tui-textfield>
                            <tui-error [error]="[] | tuiFieldError | async"
                                       formControlName="description"
                            />
                        </form>

                        <footer>
                            <button (click)="previous()"
                                    appearance="secondary"
                                    size="l"
                                    tuiButton
                                    [disabled]="formIsSending()"
                                    type="button"
                            >
                                Назад
                            </button>
                            <button size="l"
                                    tuiButton
                                    [loading]="formIsSending()"
                                    (click)="createRoute()"
                                    type="submit"
                            >
                                Создать маршрут
                            </button>
                        </footer>
                    </ng-container>
                }
            }
        </ng-container>
    </div>
</div>
