<form
        (submit)="createRoute()"
        [formGroup]="routeForm"
        tuiForm="l"
>
    <header tuiHeader>
        <h3 tuiTitle>
            Загрузить свой маршрут
            <span tuiSubtitle>Загрузите свой маршрут в GPX формате, чтобы поделиться им с другими</span>
        </h3>
    </header>

    <app-drop-zone (loadGPX)="loadFile($event)"></app-drop-zone>

    <app-ymap [GPX]="GPX()" [mapSize]="500"></app-ymap>

    <tui-textfield>
        <label for="route-title" tuiLabel>Название маршрута</label>
        <input
                formControlName="title"
                id="route-title"
                placeholder="Название"
                tuiTextfield
        />
    </tui-textfield>
    <tui-error [error]="[] | tuiFieldError | async"
               formControlName="title"
    />

    <fieldset>
        <tui-textfield>
            <label for="route-title" tuiLabel>Город</label>
            <input
                    formControlName="city"
                    id="route-title"
                    placeholder="Город"
                    tuiTextfield
            />
        </tui-textfield>
        <tui-error [error]="[] | tuiFieldError | async"
                   formControlName="city"
        />

        <tui-textfield>
            <label for="route-year" tuiLabel>Укажите дату создания маршрута</label>
            <input
                    [max]="2025"
                    [min]="2018"
                    formControlName="year"
                    id="route-year"
                    tuiInputYear
            />
            <tui-calendar-year *tuiTextfieldDropdown/>
        </tui-textfield>
        <tui-error [error]="[] | tuiFieldError | async"
                   formControlName="year"
        />
    </fieldset>

    <tui-textfield>
        <label for="route-description" tuiLabel>Limit</label>
        <textarea
                [limit]="300"
                [max]="6"
                [min]="3"
                formControlName="description"
                id="route-description"
                placeholder="Placeholder"
                tuiTextarea
        ></textarea>
    </tui-textfield>
    <tui-error [error]="[] | tuiFieldError | async"
               formControlName="description"
    />


    <footer>
        <button
                tuiButton
                type="submit"
        >
            Добавить маршрут
        </button>
        <button
                appearance="flat"
                routerLink="/"
                tuiButton
                type="button"
        >
            Отмена
        </button>
    </footer>
</form>
